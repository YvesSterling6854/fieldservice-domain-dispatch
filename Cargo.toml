[package]
name = "fieldservice-domain-dispatch"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Tenant-domain onboarding and verified dispatch handoff with Infrai"

[dependencies]
axum = "0.7.9"
hmac = "0.12.1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
thiserror = "2.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "time"] }

[[bin]]
name = "field_dispatch"
path = "src/bin/field_dispatch.rs"
